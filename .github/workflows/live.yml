name: Live-match fast lane

# During live Premier League fixtures, push fresh player stats straight into
# RTDB roughly every minute (fetch → push, looped inside one job). Outside
# match windows the first pass finds no live fixture and the job stands down
# in seconds. Display-only: Pages data/stats.json stays the canonical feed.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-fast-lane
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin (the functions' pinned version)
        run: npm ci --prefix functions
      - name: Fetch and push on a one-minute loop
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # GW1 night (21 Aug): the cron says */5 but GitHub actually fired this
          # every 25-35 min under load, and each run covered only ~4.5 min — so
          # ~85% of the match had no coverage and updates arrived in one lump
          # ("clearly doing it every 10 mins and grouping it all together").
          #
          # GitHub's scheduler cannot be made punctual, so the fix is coverage,
          # not cadence. Each run works a DEADLINE (36 min) rather than a fixed
          # number of passes, so it is immune to how long a pass happens to
          # take. Because the concurrency group is no-cancel, GitHub holds one
          # running job plus one pending: any cron tick during these 36 minutes
          # queues a successor that starts the instant this one ends, so runs
          # meet end to end even when the scheduler is 35 minutes late.
          #
          # A pass costs ~1s (the FPL fetch is 0.4s), so a 30s sleep is nearly
          # free and halves worst-case staleness. Outside a match window the
          # first pass exits 3 and the job stands down in seconds.
          end=$(( $(date +%s) + 36*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i+1))
            python3 scripts/fetch_fpl.py
            set +e
            node scripts/push_live.js
            code=$?
            set -e
            if [ "$code" = "3" ]; then echo "no live fixtures — standing down after $i pass(es)"; break; fi
            if [ "$code" != "0" ]; then exit "$code"; fi
            sleep 30
          done
          echo "completed $i pass(es)"
