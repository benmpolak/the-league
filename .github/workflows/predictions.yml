# Record what the projection said at each deadline (Marc, 15 Sept 2026).
#
# The window is between a deadline passing and that round's first kickoff —
# FPL leaves 90 minutes there. A 20-minute cron lands in it several times over;
# the first pass writes the round and every later one is a no-op, because a
# round already in the ledger is closed forever.
#
# Off-window passes cost one page load and commit nothing: the push step only
# fires on a real diff, exactly like the FPL refresh.
name: Record deadline predictions

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: predictions-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture the deadline projection
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/snapshot_predictions.js
      - name: Commit the round, if one was recorded
        run: |
          if [ -z "$(git status --porcelain data/predictions.json)" ]; then
            echo "nothing recorded this pass"
            exit 0
          fi
          git config user.name  'fpl-bot'
          git config user.email 'fpl-bot@users.noreply.github.com'
          git add data/predictions.json
          git commit -m 'data: record the deadline projection'
          # the FPL refresh commits to the same branch on a 5-minute cron, so
          # losing the race here is ordinary rather than exceptional
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 4))
            git pull --rebase --autostash || exit 1
          done
          exit 1
