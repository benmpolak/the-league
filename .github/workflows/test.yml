name: Test game engine

on:
  push:
    branches: [main, auth-v2]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local site
        run: python3 -m http.server 8125 >/tmp/the-league-http.log 2>&1 &
      - name: Syntax, no-eval guard, feed validation, full season, DGW, engine parity
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test
      - name: Auth UI + offline UX browser smokes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Install browser dependencies for the email-link client checks
        run: npm ci
      - name: Full emulator suite (same command as local development)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:emu
