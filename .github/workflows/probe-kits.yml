name: Probe away kits

# ONE-OFF reconnaissance (Marc, 5 Sept 2026: "yes, go ahead with the probe and
# see if its possible"). Answers a single question — does the Premier League
# publish away kit artwork, and at what URL — which the dev sandbox cannot ask
# because its egress proxy blocks fantasy.premierleague.com outright.
#
# Runs on push because a workflow_dispatch trigger needs a token with
# actions: write, which this session does not have.
#
# Read-only: it fetches public images and prints what it found. No secrets, no
# commits, nothing the site reads. DELETE THIS FILE once the answer is in the
# job log — it exists to be run once.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_kits.py'
      - '.github/workflows/probe-kits.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the Premier League for an away kit
        continue-on-error: true
        run: python3 scripts/probe_kits.py
