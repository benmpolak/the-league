name: Refresh FPL data

on:
  schedule:
    # every 5 minutes — GitHub's floor. Off-matchday passes are no-ops (the
    # commit gate below only pushes on a real diff), matchday lag drops from
    # ~15-20min to ~5-10min (scheduler jitter means 5 is a floor, not a promise)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # fired by the feedTick Cloud Function (28 Aug: GitHub's cron collapsed to
  # a handful of runs a day; Cloud Scheduler keeps time, GitHub does the work)
  repository_dispatch:
    types: [fpl-refresh]

permissions:
  contents: write
  actions: write # to cancel a wedged Pages deploy (see the last step)

concurrency:
  group: fpl-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FPL data
        run: python3 scripts/fetch_fpl.py
      # The deadline projection is perishable in exactly the way the team news
      # above it is: once the football starts, what the Committee thought
      # beforehand is gone, and afterwards it can only be guessed at. Same job,
      # same reason (Marc, 15 Sept 2026).
      #
      # --due reads this checkout's own calendar and answers in an exit code
      # using nothing but node's own libraries, so the overwhelming majority of
      # passes stop there in milliseconds — no install, no browser. Twice a
      # week, for the ninety minutes between a deadline and its first kickoff,
      # it says yes and the real work happens.
      #
      # A failure here must never take the data refresh down with it: a missing
      # round can still be rebuilt afterwards by the Prediction Accuracy card,
      # and a broken feed cannot be.
      - name: Record the deadline projection, if a round is due
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if node scripts/snapshot_predictions.js --due; then
            npm ci --no-audit --no-fund
            node scripts/snapshot_predictions.js
          fi
      - name: Commit if changed
        run: |
          git config user.name 'fpl-bot'
          git config user.email 'actions@github.com'
          # teamnews.json is the perishable one — the round's team news is gone
          # the moment the deadline passes, so if it is not committed here it is
          # written on the runner and thrown away (Marc, 24 Aug 2026)
          git add js/data.js data/data.json data/stats.json data/fixtures.json data/teamnews.json data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: FPL refresh'
            git push
          fi
      # 12-13 Sep: a "Deploy site to Pages" run sat in `waiting` on the
      # github-pages environment for 18 hours (no reviewers, no wait timer —
      # a GitHub-side stall). It held the no-cancel `pages` concurrency group,
      # so every deploy after it queued behind it and was cancelled by the
      # next refresh; the site served Saturday night's feed through Sunday's
      # matches while every workflow stayed green. A real deploy takes about
      # a minute and a queued one starts within five, so anything still
      # waiting or pending after ten minutes is wedged: cancel it and the
      # queue drains on its own. This refresh runs every five minutes, so it
      # is the natural watchdog.
      - name: Unwedge a stuck Pages deploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          for st in waiting pending; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow=pages.yml --status "$st" --limit 10 \
              --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"' |
            while read -r id created; do
              [ -n "$id" ] || continue
              age=$(( now - $(date -d "$created" +%s) ))
              if [ "$age" -gt 600 ]; then
                echo "cancelling wedged Pages deploy $id ($st for ${age}s)"
                gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
              fi
            done
          done
