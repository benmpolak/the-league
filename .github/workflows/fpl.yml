name: Refresh FPL data

on:
  schedule:
    # every 5 minutes — GitHub's floor. Off-matchday passes are no-ops (the
    # commit gate below only pushes on a real diff), matchday lag drops from
    # ~15-20min to ~5-10min (scheduler jitter means 5 is a floor, not a promise)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FPL data
        run: python3 scripts/fetch_fpl.py
      - name: Commit if changed
        run: |
          git config user.name 'fpl-bot'
          git config user.email 'actions@github.com'
          # teamnews.json is the perishable one — the round's team news is gone
          # the moment the deadline passes, so if it is not committed here it is
          # written on the runner and thrown away (Marc, 24 Aug 2026)
          git add js/data.js data/data.json data/stats.json data/fixtures.json data/teamnews.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: FPL refresh'
            git push
          fi
