# Deploys the sandbox (the-league-beta) through Actions, like the real site.
# Why: beta sat on GitHub's legacy Pages build, which gives up after ten
# minutes in a slow queue and emails the Chairman each time — four "Run
# failed" emails on 6 Nov 2026 alone, none of them about the real league.
# This file arrives on beta with every mirror push and runs only there; the
# real site keeps pages.yml and its release gate. No gate here: beta is the
# sandbox, and the mirror already carries main's tested code.
name: Deploy beta to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # queue behind a running deploy, never kill it

jobs:
  deploy:
    if: github.repository == 'benmpolak/the-league-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp a content hash onto the asset URLs
        run: node scripts/stamp_build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
